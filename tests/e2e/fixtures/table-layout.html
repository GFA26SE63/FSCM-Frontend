<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>Table layout regression fixture</title></head>
<body><div id="root"></div>
<script type="module">
  import React from 'react';
  import { createRoot } from 'react-dom/client';
  import { SimpleTable } from '/src/shared/ui/SimpleTable.tsx';
  import { DataTable } from '/src/shared/ui/DataTable.tsx';
  import '/src/shared/ui/styles.css';
  const columns = [
    { key: 'code', header: 'Mã sản phẩm', width: '160px', cell: (r) => r.code },
    { key: 'name', header: 'Tên sản phẩm', cell: (r) => r.name },
    { key: 'price', header: 'Đơn giá', width: '180px', cell: () => '252.000đ' },
    { key: 'note', header: 'Ghi chú', width: '320px', cell: () => 'Một bảng có nhiều cột cố định' },
  ];
  const rows = [{ code: 'SKU001', name: 'Sữa tươi tiệt trùng nguyên chất 1 lít' }];
  createRoot(document.getElementById('root')).render(React.createElement('main', {
    style: { width: 640, maxWidth: '100%', padding: 16, display: 'flex', flexDirection: 'column', gap: 20 },
  },
    React.createElement(SimpleTable, { columns, rows }),
    React.createElement(DataTable, { columns, rows, rowKey: (r) => r.code, searchable: false }),
  ));
</script></body></html>
