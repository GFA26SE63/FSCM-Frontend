name: Frontend CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FSCM-Frontend

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          path: FSCM-Frontend

      - name: Check out backend contract test sources
        uses: actions/checkout@v7
        with:
          repository: GFA26SE63/FSCM-Backend
          ref: feature/hai-sprint
          path: FSCM-Backend
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FSCM-Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test --if-present

      - name: Build
        run: npm run build

      - name: Upload CI artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-ci-${{ github.run_id }}
          path: FSCM-Frontend/dist/**
          if-no-files-found: warn
          retention-days: 14
